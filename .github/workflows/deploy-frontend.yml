name: Deploy Frontend to Hostinger

on:
  # The site is fully static: publishing a blog post = committing its file in
  # frontend/content/blog/ (plus its pictures) and pushing to main.
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

# Never run two FTP uploads at the same time
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Builds the blog from content/blog/, the sitemap, the app, and the
      # prerendered HTML for every page. Fails (and deploys nothing) if any
      # post has a mistake.
      - name: Build frontend
        run: cd frontend && npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./frontend/dist/
          server-dir: /public_html/
          protocol: ftps
          security: loose
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*